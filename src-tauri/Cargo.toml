[package]
name = "ldt-ui"
version = "0.2.0"
description = "Panel de escritorio para levantar proyectos de desarrollo, sobre ldt"
authors = ["Joaquin Lumelsky"]
license = "MIT"
repository = "https://github.com/lumel-dev/ldt-ui"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ldt_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
