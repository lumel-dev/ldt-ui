# Config unificada de Dependabot de lumel.dev (reemplaza a Renovate).
# Criterio: minors y patches agrupados en un PR por semana; los majors llegan de a
# uno y se revisan a mano. Los fixes de seguridad entran apenas salen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # React, react-dom y sus tipos, en un solo PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Tailwind y su plugin de postcss van en la misma versión.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # Todo lo demás que no sea major, junto.
      minor-y-patch:
        update-types: [minor, patch]
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "tailwindcss"
          - "@tailwindcss/*"
    ignore:
      # @types/node: sigue al Node del Dockerfile/.nvmrc (24), no al último major.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript: los majors rompen typescript-eslint, se migra a mano.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
