# Instaladores para Windows, Linux y macOS en una release de GitHub.
#
# Se dispara con un tag `v*` (el mismo numero que `version` en `tauri.conf.json`) y deja
# la release como borrador: se revisa y se publica a mano. Lanzado a mano sobre una rama
# (`gh workflow run release.yml --ref <rama>`) solo compila y deja los instaladores como
# artifacts.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # El borrador se crea una sola vez, antes de compilar. Si cada build lo buscaba y lo creaba
  # por su cuenta, corrian a la vez, ninguno lo encontraba y quedaban varios
  # borradores con el mismo tag, cada uno con los instaladores de algun sistema.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=true --jq .id
          fi

  build:
    needs: release
    # Sin tag, `release` se saltea y el build corre igual.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          # 22.04 y no la ultima: el .deb y el AppImage quedan atados a la glibc con que se
          # compilan, y una mas vieja los deja andar en mas distros.
          - os: ubuntu-22.04
            args: ''
          # Un solo .dmg para Intel y Apple Silicon.
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Directo y no con tauri-action: esa accion ademas comprime el .app de macOS y lo sube
      # como `.app.tar.gz` (el paquete del auto-actualizador, que la app no usa).
      - run: pnpm tauri build ${{ matrix.args }}

      # Solo los instaladores: `bundle/` tambien tiene el AppDir del AppImage y el .app suelto.
      - name: Juntar instaladores
        shell: bash
        run: |
          shopt -s nullglob globstar
          mkdir -p installers
          for f in src-tauri/target/**/release/bundle/*/{*.AppImage,*.deb,*.rpm,*.dmg,*.msi,*-setup.exe}; do
            cp "$f" installers/
          done
          ls -la installers
          [ -n "$(ls installers)" ]

      - name: Subir a la release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" installers/* --clobber -R "$GITHUB_REPOSITORY"

      # Sin tag no hay release: los instaladores quedan como artifacts del run, para
      # probarlos antes de publicar.
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: installers/
          retention-days: 7
