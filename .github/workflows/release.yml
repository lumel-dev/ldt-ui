# Instaladores para Windows, Linux y macOS en una release de GitHub.
#
# Se dispara con un tag `v*` (el mismo numero que `version` en `tauri.conf.json`) y deja
# la release como borrador: se revisa y se publica a mano. Lanzado a mano sobre una rama
# (`gh workflow run release.yml --ref <rama>`) solo compila y deja los instaladores como
# artifacts.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          # 22.04 y no la ultima: el .deb y el AppImage quedan atados a la glibc con que se
          # compilan, y una mas vieja los deja andar en mas distros.
          - os: ubuntu-22.04
            args: ''
          # Un solo .dmg para Intel y Apple Silicon.
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

      # Sin tag (a mano, sobre una rama) no hay release: los instaladores quedan como
      # artifacts del run, para probarlos antes de publicar.
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/*/*.*
            src-tauri/target/*/release/bundle/*/*.*
          retention-days: 7
